<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <rect width="900" height="380" fill="#f4f5f7"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#667085"/>
    </marker>
  </defs>

  <!-- Coordinador -->
  <rect x="300" y="20" width="300" height="96" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="450" y="50" text-anchor="middle" font-weight="600" font-size="16" fill="#1d2330">Coordinador (usbnetshare-registry)</text>
  <text x="450" y="74" text-anchor="middle" fill="#667085">Docker · http://servidor-docker:3250</text>
  <text x="450" y="96" text-anchor="middle" fill="#667085">Sabe qué equipo es cada ID y su IP</text>

  <!-- Servidor -->
  <rect x="30" y="200" width="320" height="150" rx="10" fill="#ffffff" stroke="#0b6bcb" stroke-width="2"/>
  <text x="190" y="230" text-anchor="middle" font-weight="600" font-size="16" fill="#1d2330">PC que comparte (modo servidor)</text>
  <text x="190" y="256" text-anchor="middle" fill="#667085">USBnetShare + UsbDk</text>
  <rect x="80" y="276" width="220" height="50" rx="8" fill="#e7f6ec" stroke="#15803d"/>
  <text x="190" y="297" text-anchor="middle" fill="#15803d" font-weight="600">USB real</text>
  <text x="190" y="315" text-anchor="middle" fill="#15803d" font-size="12">PC Adapter · USB-RS485 …</text>

  <!-- Cliente -->
  <rect x="550" y="200" width="320" height="150" rx="10" fill="#ffffff" stroke="#0b6bcb" stroke-width="2"/>
  <text x="710" y="230" text-anchor="middle" font-weight="600" font-size="16" fill="#1d2330">PC que lo usa (modo cliente)</text>
  <text x="710" y="256" text-anchor="middle" fill="#667085">USBnetShare + usbip-win2</text>
  <rect x="600" y="276" width="220" height="50" rx="8" fill="#fdf3e2" stroke="#b45309"/>
  <text x="710" y="297" text-anchor="middle" fill="#b45309" font-weight="600">USB virtual</text>
  <text x="710" y="315" text-anchor="middle" fill="#b45309" font-size="12">TIA Portal · COMx · …</text>

  <!-- Flechas -->
  <line x1="230" y1="198" x2="360" y2="120" stroke="#667085" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <line x1="670" y1="198" x2="540" y2="120" stroke="#667085" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="215" y="150" fill="#667085" font-size="12">latido cada 15 s</text>
  <text x="600" y="150" fill="#667085" font-size="12">¿dónde está el servidor?</text>
  <line x1="352" y1="300" x2="546" y2="300" stroke="#0b6bcb" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="450" y="290" text-anchor="middle" fill="#0b6bcb" font-weight="600">USB/IP · TCP 3240</text>
  <text x="450" y="322" text-anchor="middle" fill="#667085" font-size="12">conexión directa entre los dos PC</text>
</svg>
